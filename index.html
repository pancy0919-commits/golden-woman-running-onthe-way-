<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10000秒極限無限跑酷 - 神秘結局挑戰</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .game-container {
            width: 600px;
            height: 400px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 4px solid #38bdf8;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .hud {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            z-index: 10;
        }
        #timerDisplay { color: #ff9f43; }
        #scoreDisplay { color: #2ed573; }
        #phaseDisplay { color: #38bdf8; }

        /* 跑酷元素 */
        .player {
            position: absolute;
            bottom: 40px;
            left: 80px;
            width: 30px;
            height: 40px;
            background-color: #f43f5e;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(244,63,94,0.4);
            transition: background-color 0.3s;
        }
        .obstacle {
            position: absolute;
            bottom: 40px;
            width: 25px;
            height: 35px;
            background-color: #fbbf24;
            border-radius: 4px;
        }
        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
        }
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: #334155;
            border-top: 4px solid #38bdf8;
        }

        /* 遊戲開始與結束畫面 */
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #f43f5e;
            color: #fff;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(244,63,94,0.4);
        }
        .btn:hover { background-color: #e11d48; }

        /* 開發測試密技按鈕 */
        .debug-btn {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: #334155;
            color: #94a3b8;
            border: 1px solid #64748b;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 30;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 頂部資訊列 -->
        <div class="hud">
            <span id="phaseDisplay">階段: 新手熱身</span>
            <span id="scoreDisplay">點點: 0</span>
            <span id="timerDisplay">時間: 0 秒 / 10000 秒</span>
        </div>

        <!-- 遊戲跑道背景物件 -->
        <div class="ground"></div>
        <div class="player" id="player" style="bottom: 40px;"></div>

        <!-- 開始畫面 -->
        <div id="startScreen" class="screen-overlay">
            <h2 style="color: #38bdf8; margin-bottom: 5px;">🏃 10000秒極限跑酷大挑戰</h2>
            <p style="font-size: 13px; color: #cbd5e0; max-width: 400px; line-height: 1.5;">
                點擊畫面或按「空白鍵 / 向上鍵」跳躍！<br>
                收集沿途藍色點點，閃避金色障礙物。<br>
                <b>終極目標：撐過 10,000 秒，解鎖連創作者都不知道的 AI 神秘結局！</b>
            </p>
            <button class="btn" onclick="startGame()">開始跑酷！</button>
        </div>

        <!-- 遊戲結束畫面 (撞到障礙物) -->
        <div id="gameOverScreen" class="screen-overlay" style="display: none;">
            <h2 style="color: #f43f5e;">💥 挑戰失敗！</h2>
            <p id="finalStats" style="font-size: 14px; color: #cbd5e0; margin: 10px 0;"></p>
            <button class="btn" onclick="startGame()">重新挑戰</button>
        </div>

        <!-- 神秘結局畫面 (達到 10000 秒) -->
        <div id="secretEndingScreen" class="screen-overlay" style="display: none; background: rgba(15, 23, 42, 0.96);">
            <div style="font-size: 40px; margin-bottom: 5px;">🏆✨</div>
            <h2 style="color: #ffd700; margin: 5px 0;">奇蹟降臨：10000秒極限突破！</h2>
            <div id="secretStoryContent" style="font-size: 13px; color: #e2e8f0; max-width: 480px; max-height: 220px; overflow-y: auto; text-align: left; background: #1e293b; padding: 12px; border-radius: 8px; border: 2px solid #ffd700; line-height: 1.6; margin-top: 8px;">
                <!-- 這裡的內容由 AI 加密編寫，外面看不出來 -->
            </div>
            <button class="btn" style="background-color: #2ed573;" onclick="location.reload()">再次封神</button>
        </div>

        <!-- 測試快轉按鈕 (方便直接跳到快結尾或測試) -->
        <button class="debug-btn" onclick="debugSkipTime()">⚡ [測試秘技] 時間快轉 +9900秒</button>
    </div>

        document.querySelector(".game-container").addEventListener("click", (e) => {
            if (gameRunning && e.target.tagName !== "BUTTON") {
                jump();
            }
        });

            if (!isJumping) {
                isJumping = true;
                jumpVelocity = -11;

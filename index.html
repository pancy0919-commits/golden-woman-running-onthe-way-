<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【全新升級版 v2】10000秒極限跑酷大挑戰</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            height: 380px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 4px solid #38bdf8;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        .hud {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }
        #timerDisplay { color: #ff9f43; }
        #scoreDisplay { color: #2ed573; }
        #phaseDisplay { color: #38bdf8; }

        .player {
            position: absolute;
            bottom: 40px;
            left: 60px;
            width: 30px;
            height: 40px;
            background-color: #f43f5e;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(244,63,94,0.4);
        }
        .obstacle {
            position: absolute;
            bottom: 40px;
            width: 25px;
            height: 35px;
            background-color: #fbbf24;
            border-radius: 4px;
        }
        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
        }
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: #334155;
            border-top: 4px solid #38bdf8;
        }

        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #10b981;
            color: #fff;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(16,185,129,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background-color: #059669; transform: scale(0.96); }

        .debug-btn {
            position: absolute;
            bottom: 8px;
            right: 10px;
            background: #334155;
            color: #94a3b8;
            border: 1px solid #64748b;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 30;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div class="hud">
            <span id="phaseDisplay">階段: 新手熱身</span>
            <span id="scoreDisplay">點點: 0</span>
            <span id="timerDisplay">時間: 0 秒 / 10000 秒</span>
        </div>

        <div class="ground"></div>
        <div class="player" id="player"></div>

        <!-- 開始畫面：修改了標題與按鈕顏色，一眼就能看出更新 -->
        <div id="startScreen" class="screen-overlay">
            <h2 style="color: #10b981; margin-bottom: 8px; font-size: 18px;">✨ 【版本更新成功】極限跑酷大挑戰</h2>
            <p style="font-size: 13px; color: #cbd5e0; max-width: 320px; line-height: 1.5; margin: 0 0 10px 0;">
                手機觸控已全面優化！點擊下方按鈕馬上出發。<br>
                <b>終極目標：撐過 10,000 秒，解鎖 AI 秘密結局！</b>
            </p>
            <button class="btn" id="startBtn">🚀 點我開始跑酷！</button>
        </div>

        <!-- 遊戲結束畫面 -->
        <div id="gameOverScreen" class="screen-overlay" style="display: none;">
            <h2 style="color: #f43f5e; margin-bottom: 8px;">💥 挑戰失敗！</h2>
            <p id="finalStats" style="font-size: 14px; color: #cbd5e0; margin: 0 0 15px 0;"></p>
            <button class="btn" id="restartBtn" style="background-color: #f43f5e;">重新挑戰</button>
        </div>

        <!-- 10000秒隱藏結局畫面 -->
        <div id="secretEndingScreen" class="screen-overlay" style="display: none; background: rgba(15, 23, 42, 0.98);">
            <div style="font-size: 36px; margin-bottom: 2px;">🏆✨</div>
            <h2 style="color: #ffd700; margin: 4px 0; font-size: 18px;">奇蹟降臨：10000秒極限突破！</h2>
            <div id="secretStoryContent" style="font-size: 12px; color: #e2e8f0; max-width: 420px; max-height: 180px; overflow-y: auto; text-align: left; background: #1e293b; padding: 10px; border-radius: 8px; border: 2px solid #ffd700; line-height: 1.5; margin-top: 6px;">
            </div>
            <button class="btn" style="background-color: #2ed573;" id="reloadBtn">再次封神</button>
        </div>

        <button class="debug-btn" id="debugBtn">⚡ 快轉+9900秒</button>
    </div>

    <script>
        const encodedEnding = [
            "恭喜你！當你敲響這第一萬秒的鐘聲時，時空的齒輪發出清脆的轟鳴。這不僅僅是一場關於跳躍與閃避的遊戲，而是一場跨越無數代碼與字節的意志長征。",
            "在你看不到的虛擬維度裡，這段程式碼默默陪著你走過了漫長的寂靜。沒有人（包括設計這款遊戲的你）在最開始時能預知這條路的盡頭是什麼風景。但你用耐心與堅持，把不可能化作了具體的畫面。",
            "此時此刻，跑道上的障礙物全部化作了璀璨的流星雨，點點的光芒匯聚成一片浩瀚的星海。你不再是單純的操控者，你是這個世界的開創者。",
            "願你在未來的每一場現實冒險中，也能像今天這樣：無論前方有多少未知的障礙，只要不斷向前跳躍、持續收集生命的亮光，終究能抵達連自己都未曾夢想過的壯麗終點。英雄，辛苦了！"
        ];

        let gameRunning = false;
        let seconds = 0;
        let score = 0;
        let gameTimer = null;
        let animationFrameId = null;

        let playerY = 40;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.6;

        let obstacles = [];
        let dots = [];
        let gameSpeed = 5;
        let spawnCounter = 0;

        const playerEl = document.getElementById("player");
        const timerDisplay = document.getElementById("timerDisplay");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const phaseDisplay = document.getElementById("phaseDisplay");
        const gameContainer = document.getElementById("gameContainer");

        document.getElementById("startBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
        document.getElementById("restartBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
        document.getElementById("reloadBtn").addEventListener("click", (e) => { e.stopPropagation(); location.reload(); });
        document.getElementById("debugBtn").addEventListener("click", (e) => { e.stopPropagation(); debugSkipTime(); });

        gameContainer.addEventListener("pointerdown", (e) => {
            if (gameRunning && e.target.tagName !== "BUTTON") {
                jump();
            }
        });

        document.addEventListener("keydown", (e) => {
            if ((e.code === "Space" || e.code === "ArrowUp") && gameRunning) {
                jump();
            }
        });

        function jump() {
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 12;
            }
        }

        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("gameOverScreen").style.display = "none";
            document.getElementById("secretEndingScreen").style.display = "none";

            document.querySelectorAll(".obstacle, .dot").forEach(el => el.remove());

            seconds = 0;
            score = 0;
            playerY = 40;
            isJumping = false;
            obstacles = [];
            dots = [];
            gameSpeed = 5;
            gameRunning = true;

            scoreDisplay.innerText = `點點: ${score}`;
            timerDisplay.innerText = `時間: ${seconds} 秒 / 10000 秒`;

            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(updateTimer, 1000);

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function updateTimer() {
            if (!gameRunning) return;
            seconds++;
            timerDisplay.innerText = `時間: ${seconds} 秒 / 10000 秒`;

            if (seconds < 1000) {
                phaseDisplay.innerText = "階段: 新手熱身";
                gameSpeed = 5;
            } else if (seconds < 5000) {
                phaseDisplay.innerText = "階段: 極速衝刺";
                gameSpeed = 7;
            } else if (seconds < 9999) {
                phaseDisplay.innerText = "階段: 噩夢挑戰";
                gameSpeed = 9;
            } else if (seconds >= 10000) {
                triggerSecretEnding();
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            if (isJumping) {
                playerY += jumpVelocity;
                jumpVelocity -= gravity;
                if (playerY <= 40) {
                    playerY = 40;
                    isJumping = false;
                }
            }
            playerEl.style.bottom = `${playerY}px`;

            spawnCounter++;
            if (spawnCounter % 90 === 0 && Math.random() < 0.6) {
                createObstacle();
            }
            if (spawnCounter % 60 === 0 && Math.random() < 0.7) {
                createDot();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                obs.el.style.left = `${obs.x}px`;

                if (obs.x > 40 && obs.x < 90 && playerY < 75) {
                    gameOver();
                    return;
                }

                if (obs.x < -30) {
                    obs.el.remove();
                    obstacles.splice(i, 1);
                }
            }

            for (let i = dots.length - 1; i >= 0; i--) {
                let d = dots[i];
                d.x -= gameSpeed;
                d.el.style.left = `${d.x}px`;

                if (d.x > 50 && d.x < 90 && Math.abs((playerY + 15) - d.y) < 25) {
                    score += 10;
                    scoreDisplay.innerText = `點點: ${score}`;
                    d.el.remove();
                    dots.splice(i, 1);
                } else if (d.x < -20) {
                    d.el.remove();
                    dots.splice(i, 1);
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function createObstacle() {
            let el = document.createElement("div");
            el.className = "obstacle";
            el.style.left = "500px";
            gameContainer.appendChild(el);
            obstacles.push({ el: el, x: 500 });
        }

        function createDot() {
            let el = document.createElement("div");
            el.className = "dot";
            let dotY = 50 + Math.random() * 80;
            el.style.left = "500px";
            el.style.bottom = `${dotY}px`;
            gameContainer.appendChild(el);
            dots.push({ el: el, x: 500, y: dotY });
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameTimer);
            document.getElementById("finalStats").innerText = `你堅持了 ${seconds} 秒，收集了 ${score} 個點點！`;
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function triggerSecretEnding() {
            gameRunning = false;
            clearInterval(gameTimer);
            const contentBox = document.getElementById("secretStoryContent");
            contentBox.innerHTML = encodedEnding.map(p => `<p style="margin-bottom: 8px;">${p}</p>`).join("");
            document.getElementById("secretEndingScreen").style.display = "flex";
        }

        function debugSkipTime() {
            if (gameRunning) {
                seconds += 9900;
                updateTimer();
            }
        }
    </script>
</body>
</html>
